name: Storybook 11 compatibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  storybook-11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
      - name: Prepare isolated Storybook 11 workspace
        run: |
          mkdir ../storybook-11-check
          tar --exclude=.git --exclude=node_modules --exclude=storybook-static -cf - . | tar -xf - -C ../storybook-11-check
          cd ../storybook-11-check
          node -e "const fs = require('node:fs'); const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); for (const name of Object.keys(p.devDependencies)) if (name === 'storybook' || name.startsWith('@storybook/')) p.devDependencies[name] = 'next'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n')"
      - name: Install Storybook 11 prerelease dependencies
        working-directory: ../storybook-11-check
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        working-directory: ../storybook-11-check
        run: pnpm typecheck
      - name: Unit tests
        working-directory: ../storybook-11-check
        run: pnpm test
      - name: Build addon
        working-directory: ../storybook-11-check
        run: pnpm build
      - name: Build Storybook
        working-directory: ../storybook-11-check
        run: pnpm build:storybook
